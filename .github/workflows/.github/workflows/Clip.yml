name: clip-stream
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Twitch channel name"
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install streamlink
      - name: Run clipper
        run: python clipper.py "${{ github.event.inputs.channel }}"
      - name: Save clips
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips
          path: clips/
